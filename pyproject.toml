[project]
name = "cotlegibility"
version = "0.2.0"
description = "A small, inspectable study of reasoning and agent-message intelligibility"
requires-python = ">=3.11"
dependencies = [
    "wordfreq==3.1.1",
    "matplotlib==3.11.1",
]

[project.optional-dependencies]
reference = ["torch==2.14.0", "transformers==5.17.0"]
api = ["anthropic==1.4.0", "openai==3.11.0"]
dev = ["pytest"]

[project.scripts]
cot-study = "cotlegibility.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cotlegibility*"]
