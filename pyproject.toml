[project]
name = "cotlegibility"
version = "0.4.0"
description = "A small matched study of agent-handoff surprisal"
requires-python = ">=3.11"
dependencies = [
    "huggingface-hub==1.30.0",
    "pyarrow>=19",
    "httpx>=0.28,<1",
    "torch==2.14.0",
    "transformers==5.17.0",
    "numpy==2.5.3",
    "pandas==3.0.5",
    "matplotlib==3.11.1",
    "jupyterlab>=4",
    "ipykernel>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "nbclient>=0.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []
